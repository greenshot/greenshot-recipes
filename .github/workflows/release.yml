name: Publish the index

# Every merge that changes a recipe publishes index.json as a release: the website and Greenshot read the latest one.
# The signature of index.json comes later.
on:
  push:
    branches: [main]
    paths:
      - 'recipes/**'
      - 'tools/**'
      - 'catalog.schema.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-index

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GREENSHOT_REF: ${{ vars.GREENSHOT_REF || 'main' }}
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install jsonschema
        run: python -m pip install jsonschema==4.23.0

      - name: Check
        run: |
          # by commit: raw.githubusercontent.com caches a branch name for minutes
          sha=$(git ls-remote https://github.com/greenshot/greenshot "$GREENSHOT_REF" | head -n 1 | cut -f 1)
          sha=${sha:-$GREENSHOT_REF}
          curl -fsSL -o "$RUNNER_TEMP/recipe.schema.json" "https://raw.githubusercontent.com/greenshot/greenshot/$sha/docs/vNext/recipe.schema.json"
          python tools/catalog.py check --schema "$RUNNER_TEMP/recipe.schema.json"

      - name: Build index.json
        run: python tools/catalog.py index --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --out "$RUNNER_TEMP/index.json"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="catalog-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          gh release create "$tag" "$RUNNER_TEMP/index.json" --target "$GITHUB_SHA" --latest \
            --title "Catalog $(date -u +%Y-%m-%d) (${GITHUB_SHA::7})" \
            --notes "index.json of commit $GITHUB_SHA"

      - name: Tell the website
        # Rebuilds getgreenshot.org/recipes; needs a token allowed to send a repository_dispatch to greenshot/greenshot
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::WEBSITE_DISPATCH_TOKEN isn't set, the website picks up this index with its next build"
            exit 0
          fi
          gh api repos/greenshot/greenshot/dispatches -f event_type=recipes-published
